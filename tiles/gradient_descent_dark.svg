<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Gradient descent tile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.6" stop-color="#0C1736"/>
      <stop offset="1" stop-color="#04050B"/>
    </linearGradient>
    <radialGradient id="bowl" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#00D1FF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#00D1FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00D1FF" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#FF4D8D" fill-opacity="0.95"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#bowl)"/>

  <!-- Contour rings -->
  <g fill="none" stroke="#00D1FF" opacity="0.16">
    <ellipse cx="640" cy="560" rx="520" ry="320" stroke-width="6"/>
    <ellipse cx="640" cy="560" rx="430" ry="265" stroke-width="6"/>
    <ellipse cx="640" cy="560" rx="345" ry="212" stroke-width="6"/>
    <ellipse cx="640" cy="560" rx="265" ry="162" stroke-width="6"/>
    <ellipse cx="640" cy="560" rx="190" ry="118" stroke-width="6"/>
  </g>

  <!-- Descent path -->
  <g filter="url(#glow)">
    <path d="M260 320 C420 440, 510 500, 600 560 C710 635, 760 680, 840 770"
          fill="none" stroke="#FF4D8D" stroke-width="10" marker-end="url(#arrow)" opacity="0.95"/>
    <circle cx="260" cy="320" r="14" fill="#FF4D8D" opacity="0.95"/>
    <circle cx="465" cy="465" r="12" fill="#FF4D8D" opacity="0.75"/>
    <circle cx="600" cy="560" r="12" fill="#FF4D8D" opacity="0.65"/>
    <circle cx="710" cy="635" r="11" fill="#FF4D8D" opacity="0.55"/>
    <circle cx="840" cy="770" r="16" fill="#6CFFB7" opacity="0.95"/>
  </g>
</svg>
