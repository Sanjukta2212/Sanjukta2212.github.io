<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Time series tile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.6" stop-color="#0B1633"/>
      <stop offset="1" stop-color="#04050B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D1FF" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#00D1FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00D1FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="forecast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6CFFB7" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#6CFFB7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6CFFB7" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.18" stroke="#9AD7FF" stroke-width="2">
    <path d="M160 280 H1040"/>
    <path d="M160 420 H1040"/>
    <path d="M160 560 H1040"/>
    <path d="M160 700 H1040"/>
    <path d="M160 840 H1040"/>
    <path d="M280 200 V960" opacity="0.25"/>
    <path d="M440 200 V960" opacity="0.20"/>
    <path d="M600 200 V960" opacity="0.18"/>
    <path d="M760 200 V960" opacity="0.16"/>
    <path d="M920 200 V960" opacity="0.14"/>
  </g>

  <!-- Time series -->
  <g filter="url(#glow)">
    <path d="M180 820
             C260 760, 310 740, 360 760
             C430 790, 470 640, 540 610
             C610 580, 660 660, 720 620
             C800 565, 850 520, 910 560
             C980 610, 1010 500, 1040 470"
          fill="none" stroke="url(#line)" stroke-width="12"/>

    <!-- Forecast band -->
    <path d="M780 610
             C820 585, 860 560, 910 560
             C980 610, 1010 500, 1040 470
             L1040 560
             C1010 600, 980 690, 910 640
             C860 606, 820 625, 780 660 Z"
          fill="url(#forecast)"/>

    <!-- Points -->
    <circle cx="360" cy="760" r="10" fill="#FF4D8D" opacity="0.85"/>
    <circle cx="540" cy="610" r="10" fill="#FF4D8D" opacity="0.85"/>
    <circle cx="720" cy="620" r="10" fill="#FF4D8D" opacity="0.85"/>
    <circle cx="910" cy="560" r="10" fill="#FF4D8D" opacity="0.85"/>
    <circle cx="1040" cy="470" r="12" fill="#6CFFB7" opacity="0.95"/>
  </g>
</svg>
